<div class="ck stack">
  <div class="spread"><div class="title">Weekend trip packing</div><span class="sub num" data-testid="progress-label"></span></div>
  <div class="progress"><i id="bar"></i></div>
  <div class="list" id="items"></div>
</div>
<style>.ck label{display:flex;align-items:center;gap:12px;cursor:pointer;min-height:28px}.ck label.done span{color:var(--onSurface3);text-decoration:line-through}</style>
<script>
const items=[["Passport",1],["Charger",1],["Toothbrush",0],["Rain jacket",0],["Headphones",0],["Snacks",0]].map(([n,d])=>({n,d:!!d}));
function draw(){
  root.querySelector('#items').innerHTML=items.map((it,i)=>`<label class="${it.d?'done':''}" data-testid="item-${i}"><input type="checkbox" class="check" data-i="${i}" ${it.d?'checked':''}><span>${it.n}</span></label>`).join('');
  const n=items.filter(i=>i.d).length;root.querySelector('[data-testid=progress-label]').textContent=`${n}/${items.length} packed`;root.querySelector('#bar').style.width=n/items.length*100+'%';
}
root.querySelector('#items').addEventListener('change',e=>{const i=e.target.dataset.i;if(i==null)return;items[i].d=e.target.checked;draw();});
draw();
</script>
