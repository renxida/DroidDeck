<div class="cal stack">
  <div><div class="title">Today</div><div class="sub" id="next"></div></div>
  <div class="tl" id="tl"></div>
  <div class="card" data-testid="detail"><span class="sub">Tap an event for details</span></div>
</div>
<style>
.cal .tl{position:relative;height:calc(13 * 44px);margin-left:44px}
.cal .hr{position:absolute;left:-44px;right:0;border-top:1px solid var(--outline)}
.cal .hr span{position:absolute;left:0;top:-8px;font-size:11px;color:var(--onSurface3);background:var(--surface);padding-right:4px}
.cal .ev{position:absolute;left:4px;right:0;border-radius:10px;background:var(--accentSoft);border-left:3px solid var(--accent);padding:4px 8px;overflow:hidden;cursor:pointer;font-size:13px}
.cal .ev b{display:block;font-weight:600;color:var(--onSurface);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal .ev small{color:var(--onSurface2)}
.cal .ev.past{opacity:.6}
.cal .now{position:absolute;left:-6px;right:0;border-top:2px solid var(--danger)}
.cal .now::before{content:"";position:absolute;left:-4px;top:-5px;width:8px;height:8px;border-radius:50%;background:var(--danger)}
</style>
<script>
const ev=[["09:00","09:30","Standup","Zoom"],["10:00","11:30","Design review","Room 4B"],["12:30","13:15","Lunch with Sam","Tartine"],["14:00","15:00","1:1 with Priya","Room 2A"],["16:30","17:00","Dentist","24th St Dental"],["19:00","21:00","Climbing","Mission Cliffs"]];
const H=44,start=8,min=t=>{const[h,m]=t.split(':').map(Number);return h*60+m},y=t=>(min(t)-start*60)/60*H,now="13:20";
const tl=root.querySelector('#tl');let html='';
for(let h=start;h<=21;h++)html+=`<div class="hr" style="top:${(h-start)*H}px"><span>${String(h).padStart(2,'0')}:00</span></div>`;
ev.forEach(([s,e,t,l],i)=>{const h=y(e)-y(s);html+=`<div class="ev ${min(e)<=min(now)?'past':''}" data-testid="event-${i}" data-i="${i}" style="top:${y(s)+1}px;height:${h-2}px"><b>${t}</b>${h>=40?`<small>${s}–${e}</small>`:''}</div>`;});
html+=`<div class="now" style="top:${y(now)}px"></div>`;tl.innerHTML=html;
const nx=ev.find(e=>min(e[0])>min(now));root.querySelector('#next').textContent=nx?`Next: ${nx[2]} at ${nx[0]}`:'Nothing else today';
tl.addEventListener('click',e=>{const el=e.target.closest('[data-i]');if(!el)return;const[s,en,t,l]=ev[+el.dataset.i];root.querySelector('[data-testid=detail]').innerHTML=`<div class="title">${t}</div><div class="sub">${s}–${en} · ${l}</div>`;});
</script>
