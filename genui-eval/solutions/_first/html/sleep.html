<div class="sl stack">
  <div class="spread"><div><div class="title">Sleep this week</div><div class="sub">Target 8h a night</div></div><div style="text-align:right"><div class="big" id="avg"></div><div class="muted">avg / night</div></div></div>
  <div id="chart"></div>
  <div class="card row" data-testid="detail"><span class="sub">Tap a bar to see the day</span></div>
</div>
<script>
const days=[["Mon",7.2],["Tue",6.8],["Wed",6.1],["Thu",7.9],["Fri",5.4],["Sat",8.6],["Sun",8.1]].map(([label,value])=>({label,value}));
let sel=null;
const avg=days.reduce((a,d)=>a+d.value,0)/days.length;
root.querySelector('#avg').textContent=avg.toFixed(1)+'h';
const chart=root.querySelector('#chart'), detail=root.querySelector('[data-testid=detail]');
function draw(){
  chart.innerHTML=G.bar(days.map(d=>({...d,color:d.value>=8?'var(--success)':'var(--accent)'})),{target:8,unit:'h',selected:sel});
  if(sel!=null){const d=days[sel],diff=d.value-8;detail.innerHTML=`<span class="title">${d.label} · ${d.value}h</span><span class="grow"></span><span class="badge" style="${diff>=0?'background:var(--surface);color:var(--success)':''}">${diff>=0?'+':''}${diff.toFixed(1)}h vs target</span>`;}
}
chart.addEventListener('click',e=>{const b=e.target.closest('[data-bar]');if(b){sel=+b.dataset.bar;draw();}});
draw();
</script>
