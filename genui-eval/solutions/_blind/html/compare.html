<style>
.cmp .tbl{display:grid;grid-template-columns:64px repeat(3,minmax(0,1fr));gap:4px 4px;align-items:stretch}
.cmp .hd{font-weight:600;font-size:13px;line-height:1.25;padding:8px 6px;border-radius:10px}
.cmp .lb{font-size:12px;color:var(--onSurface2);display:flex;align-items:center}
.cmp .v{font-size:14px;text-align:center;padding:8px 4px;border-radius:10px;display:flex;align-items:center;justify-content:center}
.cmp .v.best{background:var(--accentSoft);color:var(--accent);font-weight:700}
.cmp .pc{display:flex;justify-content:center;padding-top:4px}
.cmp .pc .btn{width:100%;min-height:36px;padding:0 6px}
.cmp .col-picked{box-shadow:inset 0 0 0 2px var(--success)}
.cmp .hd.col-picked{background:var(--surface2)}
.cmp .choice{min-height:40px;display:flex;align-items:center}
</style>
<div class="cmp stack">
  <div><div class="title">Headphones compared</div><div class="sub">Best in each row highlighted</div></div>
  <div class="tbl"></div>
  <div class="card choice" data-testid="choice">No pick yet</div>
</div>
<script>
const items=[["Sony WH-1000XM6",449,30,254,5],["Bose QC Ultra",429,24,250,5],["Sennheiser Momentum 4",379,60,293,4]];
const rows=[{k:1,l:'Price',f:v=>'$'+v,best:'min'},{k:2,l:'Battery',f:v=>v+' h',best:'max'},{k:3,l:'Weight',f:v=>v+' g',best:'min'},{k:4,l:'ANC',f:v=>v+'/5',best:'max'}];
let picked=-1;
const tbl=root.querySelector('.tbl');
const draw=()=>{
  let h='<div></div>'+items.map((it,i)=>'<div class="hd'+(picked===i?' col-picked':'')+'">'+G.esc(it[0])+(picked===i?' ✓':'')+'</div>').join('');
  rows.forEach(r=>{
    const vals=items.map(it=>it[r.k]);
    const b=r.best==='min'?Math.min.apply(null,vals):Math.max.apply(null,vals);
    h+='<div class="lb">'+r.l+'</div>'+items.map((it,i)=>'<div class="v num'+(it[r.k]===b?' best':'')+(picked===i?' col-picked':'')+'">'+r.f(it[r.k])+'</div>').join('');
  });
  h+='<div></div>'+items.map((it,i)=>'<div class="pc"><button type="button" class="btn'+(picked===i?'':' ghost')+' small" data-i="'+i+'" data-testid="pick-'+i+'" aria-pressed="'+(picked===i)+'">'+(picked===i?'Picked':'Pick')+'</button></div>').join('');
  tbl.innerHTML=h;
  root.querySelector('[data-testid=choice]').textContent=picked>=0?'Picked: '+items[picked][0]:'No pick yet';
};
tbl.addEventListener('click',e=>{
  const b=e.target.closest('[data-testid^=pick-]');
  if(!b)return;
  picked=+b.dataset.i;
  draw();
});
draw();
</script>
