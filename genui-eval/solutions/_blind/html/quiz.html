<style>
.qz .q{font-size:19px;font-weight:600;line-height:1.3}
.qz .opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qz .opt{min-height:52px;border-radius:14px;border:1.5px solid var(--outline);background:var(--surface2);color:var(--onSurface);font:inherit;font-size:15px;font-weight:600;cursor:pointer}
.qz .opt.right{background:var(--success);border-color:var(--success);color:var(--onAccent)}
.qz .opt.wrong{background:var(--danger);border-color:var(--danger);color:var(--onAccent)}
.qz .opt.reveal{border-color:var(--success);color:var(--success)}
.qz.locked .opt{cursor:default}
.qz.locked .opt:not(.right):not(.wrong):not(.reveal){opacity:.5}
.qz .fb{min-height:44px}
.qz .fb b{display:block;margin-bottom:2px}
.qz .fb.ok b{color:var(--success)}
.qz .fb.no b{color:var(--danger)}
</style>
<div class="qz stack">
  <div class="muted">Quiz</div>
  <div class="q">Which planet has the shortest day?</div>
  <div class="opts"></div>
  <div class="card fb sub" data-testid="feedback">Pick an answer</div>
</div>
<script>
const opts=["Mercury","Venus","Jupiter","Mars"],correct=2;
let chosen=-1;
const wrap=root.querySelector('.opts');
wrap.innerHTML=opts.map((o,i)=>'<button type="button" class="opt" data-i="'+i+'" data-testid="opt-'+i+'">'+G.esc(o)+'</button>').join('');
wrap.addEventListener('click',e=>{
  const b=e.target.closest('.opt');
  if(!b||chosen>=0)return;
  chosen=+b.dataset.i;
  root.querySelector('.qz').classList.add('locked');
  wrap.querySelectorAll('.opt').forEach(x=>{
    const i=+x.dataset.i;
    x.setAttribute('aria-disabled','true');
    if(i===chosen)x.classList.add(i===correct?'right':'wrong');
    else if(i===correct)x.classList.add('reveal');
  });
  const fb=root.querySelector('[data-testid=feedback]');
  const ok=chosen===correct;
  fb.classList.add(ok?'ok':'no');
  fb.innerHTML='<b>'+(ok?'Correct!':'Not quite, it’s Jupiter')+'</b>Jupiter spins once every about 9h 56m, the shortest day of any planet.';
});
</script>
