<h3>Sleep this week</h3>
<p class="big">6h 50m <span class="muted" style="font-size:15px;font-weight:400">average</span></p>
<svg id="c" viewBox="0 0 320 170" width="100%" role="img" aria-label="Sleep hours per night, Monday to Sunday"></svg>
<script>
const d=[["M",7.2],["T",5.4],["W",6.8],["T",7.5],["F",6.1],["S",7.9],["S",7.0]];
const svg=document.getElementById('c'),H=130,top=14,max=9,bw=28,gap=(320-7*bw)/7;
const y=v=>top+H-(v/max)*H;let s='';
d.forEach(([l,v],i)=>{const x=gap/2+i*(bw+gap),short=v<6;
 s+=`<rect x="${x}" y="${y(v)}" width="${bw}" height="${top+H-y(v)}" rx="8" fill="${short?'var(--rose)':'var(--accent)'}" opacity="${short?1:.88}"/>`;
 s+=`<text x="${x+bw/2}" y="${y(v)-6}" text-anchor="middle" style="font-weight:500;fill:var(--on)">${v.toFixed(1)}</text>`;
 s+=`<text x="${x+bw/2}" y="${top+H+18}" text-anchor="middle">${l}</text>`;});
s+=`<line x1="0" x2="320" y1="${y(8)}" y2="${y(8)}" stroke="var(--on3)" stroke-dasharray="4 4"/><text x="318" y="${y(8)-5}" text-anchor="end">8h goal</text>`;
svg.innerHTML=s;
</script>
