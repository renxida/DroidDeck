<h3>Dinner split</h3>
<p class="big" id="pp">$44.38 <span class="muted" style="font-size:15px;font-weight:400">each</span></p>
<div style="display:flex;justify-content:space-between;color:var(--on2);font-size:14px;margin-bottom:6px"><span>Tip</span><span id="tl">25%</span></div>
<input id="tip" type="range" min="0" max="30" value="25" aria-label="Tip percent">
<div style="display:flex;align-items:center;justify-content:space-between;margin-top:14px">
 <span style="color:var(--on2);font-size:14px">People</span>
 <div style="display:flex;align-items:center;gap:14px">
  <button class="chip" id="m" aria-label="Fewer people" style="width:40px;padding:0">−</button>
  <span id="n" style="font:500 18px sans-serif;min-width:16px;text-align:center">4</span>
  <button class="chip" id="p" aria-label="More people" style="width:40px;padding:0">+</button>
 </div>
</div>
<div style="display:flex;justify-content:space-between;margin-top:14px;padding-top:12px;border-top:1px solid var(--outline);font-size:14px;color:var(--on2)"><span>Bill $142.00</span><span id="tot">Total $177.50</span></div>
<script>
let tip=25,n=4;const bill=142,$=id=>document.getElementById(id);
$('m').textContent='−';
function up(){const t=bill*(1+tip/100);$('tl').textContent=tip+'%';$('tot').textContent='Total $'+t.toFixed(2);
 $('pp').firstChild.textContent='$'+(t/n).toFixed(2)+' ';emit('split',{tip,n})}
$('tip').oninput=e=>{tip=+e.target.value;up()};$('m').onclick=()=>{if(n>1){n--;$('n').textContent=n;up()}};
$('p').onclick=()=>{n++;$('n').textContent=n;up()};up();
</script>
