<!doctype html>
<html data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="rt/theme.css">
</head><body><div id="root"></div>
<script src="rt/core.js"></script>
<script src="rt/preact.min.js"></script>
<script src="rt/hooks.min.js"></script>
<script src="rt/htm.min.js"></script>
<script src="rt/preact-g.js"></script>
<script>
/* Phone glue. render({kind:'preact'|'html', src, theme}). Same contract as the genui eval (rt/DOC.md). */
(function () {
  const root = document.getElementById('root');
  const B = window.claudeBridge || { height() {}, rendered() {}, event() {}, log() {} };
  const timers = new Set(), si = setInterval, st = setTimeout, ci = clearInterval, ct = clearTimeout;
  window.setInterval = (f, ms, ...a) => { const id = si(f, ms, ...a); timers.add(id); return id; };
  window.setTimeout = (f, ms, ...a) => { const id = st(() => { timers.delete(id); f(...a); }, ms); timers.add(id); return id; };
  let lastH = -1;
  const report = () => { const h = Math.ceil(root.getBoundingClientRect().height); if (h !== lastH) { lastH = h; B.height(h); } };
  new ResizeObserver(report).observe(root);
  window.setTheme = (t) => { document.documentElement.dataset.theme = t; };
  window.emit = (type, data) => B.event(JSON.stringify({ type, data }));
  window.clearCanvas = () => { timers.forEach((id) => { ci(id); ct(id); }); timers.clear(); preact.render(null, root); root.innerHTML = ''; report(); };
  const err = (e) => { B.log('render error: ' + (e && e.stack || e)); const d = document.createElement('div'); d.className = 'g-err'; d.textContent = String(e && e.message || e); root.appendChild(d); };
  window.render = function (p) {
    const t0 = performance.now();
    setTheme(p.theme || 'light');
    clearCanvas();
    try {
      if (p.kind === 'html') {
        root.innerHTML = p.src;
        for (const s of root.querySelectorAll('script')) { const n = document.createElement('script'); n.textContent = '(function(root){' + s.textContent + '\n})(document.getElementById("root"))'; s.replaceWith(n); }
      } else window.__renderImpl(p.src, root);
    } catch (e) { err(e); }
    root.classList.remove('in'); void root.offsetWidth; root.classList.add('in');
    report();
    requestAnimationFrame(() => requestAnimationFrame(() => B.rendered(performance.now() - t0)));
  };
  // JIT-warm the runtime once while nobody is looking (the phone keeps this WebView alive).
  try { window.__renderImpl('function App(){const [n]=useState(1);return html`<div class="card"><${G.Bar} data=${[{label:"a",value:n}]}/></div>`}\nreturn App;', root); preact.render(null, root); root.innerHTML = ''; } catch (e) {}
})();
</script></body></html>
