name: Off-phone launch rig

on:
  push:
    branches: [ci/offphone-probe]
  workflow_dispatch:
    inputs:
      build_run:
        description: Build APK run id whose droiddeck-apk to test (default the newest green perf/switchboard build)
        required: false
      start_timeout:
        description: seconds to wait for the Steam session to be READY
        required: false
        default: '1200'
      image:
        description: redroid image
        required: false
        default: redroid/redroid:14.0.0_64only-latest

permissions:
  contents: read
  actions: read

jobs:
  rig:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    env:
      ANDROID_SERIAL: 127.0.0.1:5555
      REDROID_IMAGE: ${{ inputs.image || 'redroid/redroid:14.0.0_64only-latest' }}
    steps:
      - uses: actions/checkout@v4
      - name: Find the APK build
        id: apk
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=${{ inputs.build_run }}
          if [ -z "$run" ]; then
            run=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/build.yml/runs?branch=perf/switchboard&status=success&per_page=1" --jq '.workflow_runs[0].id')
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "Testing the APK from build run $run" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/download-artifact@v4
        with:
          name: droiddeck-apk
          run-id: ${{ steps.apk.outputs.run }}
          github-token: ${{ github.token }}
          path: apk
      - name: Host tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq adb >/dev/null
      - name: Boot Android
        run: tools/offphone/redroid-up.sh
      - name: Install and smoke the app
        run: |
          apk=$(ls apk/*.apk | head -1)
          tools/device-smoke.sh --apk "$apk" --no-fold 2>&1 | tee smoke.txt
          pkg=$(tools/app-id)
          adb install -r -g "$apk" >/dev/null
          adb shell pm grant "$pkg" android.permission.POST_NOTIFICATIONS || true
          adb shell am force-stop "$pkg"
          act=$(adb shell cmd package resolve-activity --brief -c android.intent.category.LAUNCHER "$pkg" | tr -d '\r' | tail -1)
          echo "launcher activity: $act"; adb shell am start -W -n "$act" || true
          sleep 8
          echo "::group::top activity"; adb shell dumpsys activity activities | grep -m3 -E "topResumedActivity|ResumedActivity"; echo "::endgroup::"
          echo "::group::app UI"; tools/droiddeckctl ui dump 2>&1 | head -c 6000; echo; echo "::endgroup::"
      - name: Start the Steam session
        continue-on-error: true
        run: |
          mkdir -p out
          adb shell device_config set_sync_disabled_for_tests persistent || true
          adb shell device_config put activity_manager max_phantom_processes 2147483647 || true
          adb shell settings put global settings_enable_monitor_phantom_procs false || true
          t0=$(date +%s)
          tools/droiddeckctl start steam 2>&1 | tee out/start.txt
          sleep 5
          echo "::group::UI after start"; tools/droiddeckctl ui dump 2>&1 | jq -c '.windows[]?.nodes[]? | select(.text or .tag) | [.tag, .text]' 2>/dev/null | head -60; echo "::endgroup::"
          last=
          while [ $(( $(date +%s) - t0 )) -lt ${{ inputs.start_timeout || 1200 }} ]; do
            st=$(tools/droiddeckctl state 2>/dev/null)
            ph=$(jq -r '.session.phase // "?"' <<<"$st" 2>/dev/null)
            line="$ph $(jq -c '{step:.session.step, status:.session.status, error:.session.error}' <<<"$st" 2>/dev/null)"
            if [ "$line" != "$last" ]; then echo "+$(( $(date +%s) - t0 ))s $line"; last=$line; fi
            if [ "$ph" = IDLE ] && tools/droiddeckctl ui dump 2>/dev/null | grep -q "Install anyway"; then
              echo "+$(( $(date +%s) - t0 ))s unsupported-GPU dialog: pressing Install anyway"
              tools/droiddeckctl ui click --match "Install anyway" >/dev/null 2>&1 || true
              sleep 3; tools/droiddeckctl start steam >/dev/null 2>&1 || true
            fi
            echo "$st" > out/state.json
            case $ph in READY|FAILED) break;; IDLE|\?) ;; *) seen=1;; esac
            # The session ran and went back to idle: it ended on its own.
            if [ -n "${seen:-}" ] && [ "$ph" = IDLE ]; then idle=$(( ${idle:-0} + 1 )); [ $idle -ge 3 ] && { echo "session ended without READY"; break; }; else idle=0; fi
            sleep 10
          done
          echo "::group::final state"; cat out/state.json; echo "::endgroup::"
          [ "$ph" = READY ]
      - name: Diagnostics
        if: always()
        run: |
          pkg=$(tools/app-id)
          echo "::group::app UI"; tools/droiddeckctl ui dump 2>&1 | head -c 6000; echo; echo "::endgroup::"
          echo "::group::logcat (app and errors)"
          pid=$(adb shell pidof "$pkg" | tr -d '\r')
          adb logcat -d -v time | grep -E "\( *${pid:-NOPID}\)|AgentStart|AgentBridge|LinuxRuntime|ActivityTaskManager|kestrel" | grep -v -E "chatty|JIT allocated|Compiler allocated" | tail -400
          echo "::endgroup::"
          d=/data/user/0/$pkg/files/logs
          last=$(adb shell "ls -1d $d/*/ 2>/dev/null | tail -1" | tr -d '\r')
          echo "session dir: ${last:-none}"
          if [ -n "$last" ]; then
            adb shell "ls -la $last"
            for f in $(adb shell "ls -1 $last" | tr -d '\r'); do
              case $f in *.log|*.txt|*.json|*.jsonl) ;; *) continue;; esac
              echo "::group::session $f"; adb shell "tail -c 20000 $last$f"; echo; echo "::endgroup::"
            done
          fi
      - name: Collect
        if: always()
        run: |
          mkdir -p out
          tools/droiddeckctl state > out/state.json 2>&1 || true
          tools/droiddeckctl screenshot out/screen.png > /dev/null 2>&1 || adb exec-out screencap -p > out/screen.png || true
          tools/droiddeckctl logs out/session > out/logs.txt 2>&1 || true
          adb logcat -d > out/logcat.txt 2>&1 || true
          adb shell dumpsys meminfo > out/meminfo.txt 2>&1 || true
          docker logs kestrel-android > out/redroid.txt 2>&1 || true
          cp smoke.txt out/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offphone-rig
          path: out
          retention-days: 7
