name: FEX translator bench (off-device)

# What the x86 translator costs a .NET game, measured without the phone: the same .NET 9 IL
# (tools/fex/bench) runs natively on an arm64 runner and as x86-64 .NET under FEX built from
# tools/fex/arm64ec/FEX_REF + patches (the FEXCore the game's ARM64EC FEX uses), across the
# settings in tools/fex/bench/configs.txt, with FEX's own JIT/SMC/SIGBUS counters.

on:
  push:
    branches: ['perf/emu-fex', 'perf/emu-fex-*', 'emu/fex', 'emu/fex-*']
    paths:
      - 'tools/fex/arm64ec/**'
      - 'tools/fex/bench/**'
      - 'tools/fex/stats/**'
      - '.github/workflows/fex-bench.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fex-bench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Host
        run: |
          lscpu | sed -n '1,25p'
          grep -m1 -o 'lrcpc\|ilrcpc' /proc/cpuinfo | sort -u || true
      - name: Build Linux FEX (same source and patches as the game's FEX)
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq clang lld llvm ninja-build cmake bc time >/dev/null
          WORK="$PWD/fex-ec" tools/fex/arm64ec/build.sh fetch
          # Keep FEX's symbol table so the profile can name functions (Release links with --strip-all).
          sed -i '/--strip-all"/d' fex-ec/src/Data/CMake/LinkerGC.cmake
          cmake -S fex-ec/src -B fex-linux -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DUSE_LINKER=lld \
            -DTUNE_CPU=none -DTUNE_ARCH=armv8-a -DBUILD_TESTING=OFF -DBUILD_FEXCONFIG=OFF -DBUILD_THUNKS=OFF \
            -DENABLE_ASSERTIONS=OFF -DENABLE_CCACHE=OFF -DENABLE_OFFLINE_TELEMETRY=OFF \
            -DCMAKE_C_FLAGS=-g -DCMAKE_CXX_FLAGS=-g
          ninja -C fex-linux FEX FEXServer
          gcc -O2 -Wall -o fex-stats tools/fex/stats/fex-stats.c
      - name: x86-64 rootfs with x64 .NET 9
        run: |
          set -euo pipefail
          cid=$(docker create --platform linux/amd64 ubuntu:24.04)
          mkdir rootfs && docker export "$cid" | tar -C rootfs -x
          # The same runtime version as the arm64 one setup-dotnet installed, straight from Microsoft's build CDN.
          ver=$(dotnet --list-runtimes | awk '/Microsoft.NETCore.App 9\./{v=$2} END{print v}')
          mkdir -p rootfs/opt/dotnet
          curl -fsSL --retry 6 --retry-all-errors --retry-delay 10 -o dotnet-x64.tar.gz \
            "https://builds.dotnet.microsoft.com/dotnet/Runtime/$ver/dotnet-runtime-$ver-linux-x64.tar.gz"
          tar -C rootfs/opt/dotnet -xzf dotnet-x64.tar.gz
          dotnet build -c Release -o bench-bin tools/fex/bench/Bench.csproj
          # The same bench precompiled with ReadyToRun (crossgen2), for x64 under FEX and for native arm64.
          dotnet publish -c Release -r linux-x64 --self-contained false -p:PublishReadyToRun=true -o bench-r2r-x64 tools/fex/bench/Bench.csproj
          dotnet publish -c Release -r linux-arm64 --self-contained false -p:PublishReadyToRun=true -o bench-r2r-arm64 tools/fex/bench/Bench.csproj
          ls -l bench-bin/Bench.dll bench-r2r-x64/Bench.dll bench-r2r-arm64/Bench.dll
          mkdir -p rootfs/bench/jit rootfs/bench/r2r && cp bench-bin/* rootfs/bench/ && cp bench-bin/* rootfs/bench/jit/
          cp bench-r2r-x64/* rootfs/bench/r2r/
          ls rootfs/opt/dotnet/shared/Microsoft.NETCore.App
      - name: Run
        env:
          BENCH_DLL: ${{ github.workspace }}/bench-bin/Bench.dll
          FEX_BIN: ${{ github.workspace }}/fex-linux/Bin
          ROOTFS: ${{ github.workspace }}/rootfs
          FEX_STATS: ${{ github.workspace }}/fex-stats
          OUT: ${{ github.workspace }}/bench-out
        run: |
          set -euo pipefail
          export PATH="$FEX_BIN:$PATH"
          ROUNDS=2 tools/fex/bench/run.sh
          cat bench-out/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Frame loop, every approach (code caches, ReadyToRun, ordering, regions, huge pages)
        env:
          JIT_DLL: ${{ github.workspace }}/bench-bin/Bench.dll
          R2R_DLL: ${{ github.workspace }}/bench-r2r-arm64/Bench.dll
          FEX_BIN: ${{ github.workspace }}/fex-linux/Bin
          ROOTFS: ${{ github.workspace }}/rootfs
          FEX_STATS: ${{ github.workspace }}/fex-stats
          OUT: ${{ github.workspace }}/bench-out
        run: |
          set -euo pipefail
          export PATH="$FEX_BIN:$PATH"
          tools/fex/bench/cache-bench.sh
          cat bench-out/frames-summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Profile where FEX's time goes (warm disk cache, and fresh)
        env:
          FEX_BIN: ${{ github.workspace }}/fex-linux/Bin
          ROOTFS: ${{ github.workspace }}/rootfs
          OUT: ${{ github.workspace }}/bench-out
        run: |
          sudo apt-get install -y -qq binutils-x86-64-linux-gnu >/dev/null 2>&1 || true
          sudo apt-get install -y -qq "linux-tools-$(uname -r)" linux-tools-common >/dev/null 2>&1 \
            || sudo apt-get install -y -qq linux-tools-azure linux-tools-generic >/dev/null 2>&1 || true
          sudo sysctl -q kernel.perf_event_paranoid=-1 kernel.kptr_restrict=0 || true
                    # Which guest library the time in translated code belongs to (disk cache off so every block is named).
          # The frame loop: which guest library the translated time belongs to (thunking headroom), then the hottest
          # blocks disassembled (vector code, flags, candidates for hand tuning).
          CONFIG=fex_l1_256k ARGS="600 frames" EXTRA="FEX_DISKCACHE=0 FEX_LIBRARYJITNAMING=1" tools/fex/bench/profile.sh
          CONFIG=fex_l1_256k ARGS="600 frames" EXTRA="FEX_DISKCACHE=0 FEX_BLOCKJITNAMING=1" tools/fex/bench/profile.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fex-bench
          path: bench-out
