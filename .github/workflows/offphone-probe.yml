name: Off-phone rig probe

on:
  push:
    branches: [ci/offphone-probe]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, ubuntu-24.04, ubuntu-22.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Host facts
        run: |
          set -x
          uname -a; nproc; free -g; df -h / /mnt || true
          cat /proc/cpuinfo | grep -m3 -i -E "model name|CPU part|Features" || true
          ls -l /dev/kvm || echo "NO /dev/kvm"
          grep -c -E 'vmx|svm' /proc/cpuinfo || true
          dmesg 2>/dev/null | grep -i -E 'kvm|hyp' | head || sudo dmesg | grep -i -E 'kvm|el2|hyp' | head || true
          ls /lib/modules/$(uname -r)/kernel/drivers/android 2>/dev/null || echo "no drivers/android dir"
          find /lib/modules/$(uname -r) -name 'binder*' -o -name 'ashmem*' | head
          grep -E 'BINDER|ASHMEM|ANDROID' /boot/config-$(uname -r) || true
          getconf PAGESIZE
          grep -E 'CONFIG_ARM64_(4K|16K|64K)_PAGES|CONFIG_ARM64_VA_BITS=' /boot/config-$(uname -r) || true
      - name: Try binder and KVM
        run: |
          set -x
          sudo modprobe kvm 2>&1 || true
          ls -l /dev/kvm || true
          sudo apt-get install -y -qq linux-modules-extra-$(uname -r) >/dev/null 2>&1 && echo "modules-extra installed" || echo "modules-extra not available"
          sudo modprobe binder_linux devices="binder,hwbinder,vndbinder" 2>&1 && echo BINDER_OK || echo BINDER_FAIL
          sudo mkdir -p /dev/binderfs && sudo mount -t binder binder /dev/binderfs 2>&1 && ls /dev/binderfs && echo BINDERFS_OK || echo BINDERFS_FAIL
          lsmod | grep -E 'binder|kvm' || true
          docker version --format '{{.Server.Version}} {{.Server.Arch}}' || true
