name: FEX upstream Godot crash bisect (Wine ARM64EC, off-device)

# Upstream FEX at ab135df (Kestrel's base) crashes the Godot 4.5.1 mono stand-in at ~10 s with a page fault
# inside StandIn.exe; Hangover 11.16's FEX (FEX-2608) runs it. Rounds 1-2 (runs 43635698654, 43636809784) put the
# break at FEX PR #6094 (effbda6, "Feature flag fixes and alignment between targets"): fb68b0e 5/5, effbda6 0/5.
# That PR changes three things. Each variant here is ab135df with one of them undone, no Kestrel patches:
#   nopa   preserve_all stays off under mingw (the PR turned it on for clang >= 22.1; llvm-mingw 20261104 is 23.1.5)
#   nocmo  cache maintenance ops stay off under Wine (the PR passed IsWine where it had passed !IsWine)
#   wow64  the ARM64EC module asks for Wow64 host features again (the PR's copy-paste fix)
# Nothing is published.

on:
  push:
    branches: ['emu/winetest-bisect*']
    paths:
      - '.github/workflows/fex-upstream-bisect.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  HANGOVER_TAG: hangover-11.16
  LLVM_MINGW: llvm-mingw-20261104-ucrt-ubuntu-22.04-aarch64
  GODOT_RUNS: '8'

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        var: ['none', 'nopa', 'nocmo', 'wow64']
    name: build-${{ matrix.var }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build zstd >/dev/null
          curl -fsSL -o "$RUNNER_TEMP/lm.tar.xz" "https://github.com/mstorsjo/llvm-mingw/releases/download/20261104/$LLVM_MINGW.tar.xz"
          tar -C "$RUNNER_TEMP" -xf "$RUNNER_TEMP/lm.tar.xz"
          echo "$RUNNER_TEMP/$LLVM_MINGW/bin" >> "$GITHUB_PATH"
      - name: Recipe at ab135df, no patches
        run: |
          set -euo pipefail
          r=recipe/tools/fex/arm64ec
          mkdir -p "$r/patches"
          cp tools/fex/arm64ec/build.sh "$r/"
          echo ab135df091d005cc98dfddc56c3dc9c9e4bd501d > "$r/FEX_REF"
          cat "$r/FEX_REF"
          sed -i 's|for p in "$HERE"/patches/\*.patch; do|for p in $(ls "$HERE"/patches/*.patch 2>/dev/null); do|; s|cat "$HERE"/patches/\*.patch|cat /dev/null|g' "$r/build.sh"
      - name: Source, with fmt made to build under today's llvm-mingw
        # FEX before late September 2026 fails here in fmt's std.h (std::atomic_flag without <atomic>); the include
        # changes nothing else. build.sh then finds the source fetched and skips its own fetch.
        run: |
          set -euo pipefail
          ref=$(cat recipe/tools/fex/arm64ec/FEX_REF)
          src=fex-ec/src
          rm -rf fex-ec && mkdir -p "$src"
          git -C "$src" init -q
          git -C "$src" remote add origin https://github.com/FEX-Emu/FEX.git
          git -C "$src" fetch -q --depth 1 origin "$ref"
          git -C "$src" checkout -q FETCH_HEAD
          git -C "$src" submodule update -q --init --depth 1
          f=$src/External/fmt/include/fmt/std.h
          if [ -f "$f" ] && ! grep -q '#include <atomic>' "$f"; then
            sed -i '0,/^#include /s//#include <atomic>\n#include /' "$f" && echo "fmt: added <atomic>"
          fi
          case "${{ matrix.var }}" in
            nopa)  sed -i 's/set(CLANG_MINIMUM_VERSION 22.1)/set(CLANG_MINIMUM_VERSION 999)/' "$src/CMakeLists.txt" ;;
            nocmo) sed -i 's/FEX::FetchHostFeatures(Features, HostFeatures, IsWine, CTR, MIDR);/FEX::FetchHostFeatures(Features, HostFeatures, !IsWine, CTR, MIDR);/' "$src/Source/Windows/Common/CPUFeatures.cpp" ;;
            wow64) sed -i 's/FetchHostFeatures(IsWine, FEXCore::HostFeatures::HostTypeEnum::Arm64ec,/FetchHostFeatures(IsWine, FEXCore::HostFeatures::HostTypeEnum::Wow64,/' "$src/Source/Windows/ARM64EC/Module.cpp" ;;
          esac
          git -C "$src" diff --stat; git -C "$src" diff | head -40
          if [ "${{ matrix.var }}" != none ] && git -C "$src" diff --quiet; then echo "variant ${{ matrix.var }} changed nothing" >&2; exit 1; fi
          echo "$ref $(cat /dev/null | sha256sum | cut -c1-16)" > fex-ec/applied
      - name: Build the DLLs
        run: WORK="$PWD/fex-ec" recipe/tools/fex/arm64ec/build.sh dlls
      - name: Build the unixlibs (Debian 12)
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/work" -w /work debian:bookworm bash -c '
            apt-get update -qq && apt-get install -y -qq g++ cmake ninja-build git binutils >/dev/null
            git config --global --add safe.directory "*"
            WORK=/work/fex-ec recipe/tools/fex/arm64ec/build.sh unixlib'
          sudo chown -R "$(id -u):$(id -g)" fex-ec
          mkdir -p out && cp fex-ec/install/usr/lib/wine/aarch64-windows/libarm64ecfex.dll fex-ec/install/usr/lib/wine/aarch64-unix/libarm64ecfex.so out/
      - uses: actions/upload-artifact@v4
        with:
          name: up-fex-${{ matrix.var }}
          path: out

  programs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Godot stand-in
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/fex/winetest/get-standin.sh bin/standin
      - uses: actions/upload-artifact@v4
        with:
          name: up-programs
          path: bin

  run:
    needs: [build, programs]
    if: always() && needs.programs.result == 'success'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: [{fex: stock, env: game}, {fex: none, env: game}, {fex: nopa, env: game}, {fex: nocmo, env: game}, {fex: wow64, env: game}]
    name: run-${{ matrix.fex }}-${{ matrix.env }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: up-programs
          path: ${{ runner.temp }}/bin
      - uses: actions/download-artifact@v4
        if: matrix.fex != 'stock'
        with:
          name: up-fex-${{ matrix.fex }}
          path: ${{ runner.temp }}/fex
      - name: Wine (Hangover ARM64EC)
        env:
          GH_TOKEN: ${{ github.token }}
        run: WINEPREFIX="$RUNNER_TEMP/pfx" tools/fex/winetest/setup-hangover.sh "$HANGOVER_TAG" "$RUNNER_TEMP/w"
      - name: This row's FEX
        if: matrix.fex != 'stock'
        run: tools/fex/winetest/install-fex.sh "$RUNNER_TEMP/w" "$RUNNER_TEMP/fex"
      - name: Run
        shell: bash
        run: |
          # shell: bash is bash -eo pipefail; a crashed run or a grep that finds nothing must not end the row.
          set +e +o pipefail -u
          export WINEPREFIX="$RUNNER_TEMP/pfx" WINEDEBUG=-all,err+seh WINEDLLOVERRIDES="mshtml=" HODLL64=libarm64ecfex.dll
          case "${{ matrix.env }}" in
            game) export FEX_TSOENABLED=1 FEX_VECTORTSOENABLED=1 FEX_MEMCPYSETTSOENABLED=1 FEX_HALFBARRIERTSOENABLED=1 FEX_X87REDUCEDPRECISION=0 ;;
            tso) export FEX_TSOENABLED=1 ;;
          esac
          env | grep '^FEX_' | sort
          out="$RUNNER_TEMP/out"; mkdir -p "$out"; : > "$out/verdicts.txt"
          for i in $(seq 1 "$GODOT_RUNS"); do
            HB_RE='^(STANDIN_DEPS|FIRST_FRAME|MAINLOOP_OK)' DONE_RE='^MAINLOOP_OK' OPS_KEY=frames STALL_S=120 \
              PROG_ARGS="--headless -- --quit-after-frames 600" \
              tools/fex/winetest/run.sh "godot$i" "$out" 60 "$RUNNER_TEMP/bin/standin/StandIn.exe" > "$out/godot$i.verdict" 2>&1
            grep '^VERDICT ' "$out/godot$i.verdict" >> "$out/verdicts.txt" || echo "VERDICT godot$i no-verdict 0 0 0" >> "$out/verdicts.txt"
            grep -a 'page fault\|Unhandled\|Fatal' "$out/godot$i.err" | head -2 | sed "s/^/godot$i: /"
            wineserver -k; sleep 1
          done
          cat "$out/verdicts.txt"
          g=$(grep -c 'VERDICT godot[0-9]* done' "$out/verdicts.txt")
          echo "SUMMARY ${{ matrix.fex }} ${{ matrix.env }} godot $g/$GODOT_RUNS" | tee -a "$GITHUB_STEP_SUMMARY"
