name: claude-phone-proto
on:
  push:
    branches: [claude-phone-proto]
  workflow_dispatch:
jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api: [35, 36]
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash proto/host-test.sh results/api${{ matrix.api }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-api${{ matrix.api }}
          path: results/
  redroid:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Binder and Redroid
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq linux-modules-extra-$(uname -r) android-tools-adb || true
          sudo modprobe binder_linux devices="binder,hwbinder,vndbinder" || echo "no binder module"
          ls -l /dev/binder* || true
          docker run -d --privileged --name redroid -p 5555:5555 redroid/redroid:15.0.0_64only-latest
          sleep 20
          adb connect localhost:5555
          timeout 300 adb wait-for-device
          bash proto/host-test.sh results/redroid15
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: redroid15
          path: results/
