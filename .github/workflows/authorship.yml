name: Build validation

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]
  workflow_run:
    workflows: [Build APK]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request to validate; empty for main
        required: false

permissions:
  contents: read
  actions: read
  pull-requests: read
  statuses: write

jobs:
  validate:
    name: Validate source and build result
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate source and APK compilation
        env:
          GH_TOKEN: ${{ github.token }}
          # Forks build their own changes, including AI-assisted ones; upstream keeps the check.
          DROIDDECK_SKIP_AUTHORSHIP: ${{ github.event.repository.fork && '1' || '' }}
        run: |
          gh auth setup-git
          python3 tools/release/validate_apk.py
