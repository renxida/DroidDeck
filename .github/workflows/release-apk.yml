name: Release APK

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Actions run ID to pull the droiddeck-apk artifact from
        required: true
      skip_rig:
        description: Publish without the off-phone launch rig (only when the rig itself is broken)
        type: boolean
        default: false
  workflow_run:
    workflows: [Build APK]
    branches: [perf/switchboard]
    types: [completed]

permissions:
  contents: write
  actions: read

jobs:
  # The APK must start Steam to its sign-in screen and run the stand-in game through Proton and
  # FEX on CI Android before it becomes kestrel.apk (tools/offphone/README.md).
  rig:
    if: >-
      (github.event_name == 'workflow_dispatch' && !inputs.skip_rig) ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    uses: ./.github/workflows/offphone-rig.yml
    with:
      apk_run_id: ${{ inputs.run_id || format('{0}', github.event.workflow_run.id) }}
      scenario: all

  release:
    needs: rig
    if: >-
      always() &&
      (needs.rig.result == 'success' ||
       (needs.rig.result == 'skipped' && github.event_name == 'workflow_dispatch' && inputs.skip_rig))
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_ID: ${{ inputs.run_id || github.event.workflow_run.id }}
    steps:
      - name: Download artifact
        run: gh run download "$RUN_ID" -n droiddeck-apk -D apk

      - name: Rename APK
        run: |
          apk=$(find apk -name '*.apk' | head -n1)
          test -n "$apk" || { echo "no .apk in artifact"; exit 1; }
          cp "$apk" kestrel.apk

      - name: Publish to release "latest"
        run: |
          gh release view latest >/dev/null 2>&1 || \
            gh release create latest --title latest --notes "APK from run $RUN_ID" --target "${{ github.sha }}"
          gh release upload latest kestrel.apk --clobber
