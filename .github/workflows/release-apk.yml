name: Release APK

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Actions run ID to pull the droiddeck-apk artifact from
        required: true

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download artifact
        run: gh run download "${{ inputs.run_id }}" -n droiddeck-apk -D apk

      - name: Rename APK
        run: |
          apk=$(find apk -name '*.apk' | head -n1)
          test -n "$apk" || { echo "no .apk in artifact"; exit 1; }
          cp "$apk" kestrel.apk

      - name: Publish to release "latest"
        run: |
          gh release view latest >/dev/null 2>&1 || \
            gh release create latest --title latest --notes "APK from run ${{ inputs.run_id }}" --target "${{ github.sha }}"
          gh release upload latest kestrel.apk --clobber
